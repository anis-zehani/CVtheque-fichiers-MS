#################### Deployment ####################
---
apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: fichiers-deployment
  labels:
    app: fichiers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fichiers
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fichiers
    spec:
      containers:
      - name: fichiers-container
        image: registry.gitlab.com/gitlabodix/cvtheque-fichiers-ms-prod
        args: ["--spring.profiles.active=prod"]
        imagePullPolicy: Never
        ports:
        - containerPort: 8005
      imagePullSecrets:
      - name: gitlab-secrets-fichiers-ms
---
apiVersion: v1
kind: Service
metadata:
  name: fichiers-ms
spec:
  selector:
    app: fichiers
  ports:
    - port: 8005
      targetPort: 8005



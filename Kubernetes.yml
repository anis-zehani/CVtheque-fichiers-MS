apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: fichiers-deployment
  labels:
    app: fichiers
spec:
  replicas: 1 #  tells deployment to run 1 pod matching the template
  selector:
    matchLabels:
      app: fichiers
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fichiers
    spec:
      containers:
      - name: fichiers-container
        image: registry.gitlab.com/gitlabodix/fichiers-ms
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
---
apiVersion: v1
kind: Service
metadata:
  name: fichiers-service
spec:
  selector:
    app: fichiers
  ports:
    - port: 8005
      targetPort: 8005

